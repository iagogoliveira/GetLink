<div class="tela-centrada">
  <form class="cartao form-auth" [formGroup]="form" (ngSubmit)="cadastrar()">
    <header>
      <h1>Criar conta</h1>
      <p class="sutil">Leva menos de um minuto.</p>
    </header>

    @if (erro(); as mensagem) {
      <p class="erro" role="alert">{{ mensagem }}</p>
    }

    <label>
      <span>Nome</span>
      <input type="text" formControlName="name" autocomplete="name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small class="erro-campo">Informe seu nome (ao menos 2 caracteres).</small>
      }
    </label>

    <label>
      <span>Login</span>
      <input type="text" formControlName="login" autocomplete="username" />
      @if (form.controls.login.touched && form.controls.login.invalid) {
        <small class="erro-campo">O login precisa ter ao menos 3 caracteres.</small>
      }
    </label>

    <label>
      <span>E-mail</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="erro-campo">Informe um e-mail valido.</small>
      }
    </label>

    <label>
      <span>Senha</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="erro-campo">A senha precisa ter ao menos 8 caracteres.</small>
      }
    </label>

    <button type="submit" class="botao primario" [disabled]="enviando()">
      {{ enviando() ? 'Criando...' : 'Criar conta' }}
    </button>

    <p class="sutil centro">Ja tem conta? <a routerLink="/login">Entrar</a></p>
  </form>
</div>
