services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no arquivo .env}

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql


  authservice:
    build:
      context: ./AuthService

    container_name: authservice

    ports:
      - "7001:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      # Trusted_Connection e autenticacao do Windows e nao funciona em container Linux,
      # por isso a string do appsettings e sobrescrita aqui.
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=AuthServiceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      # Tem de ser o mesmo segredo do urlshortener: a assinatura do JWT e simetrica.
      JwtSettings__SecretKey: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}

    depends_on:
      - sqlserver


  urlshortener:
    build:
      context: ./urlShortener

    container_name: urlshortener

    ports:
      - "7000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=UrlShortenerDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      JwtSettings__SecretKey: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}

    depends_on:
      - sqlserver
      - authservice


volumes:
  sql_data:
