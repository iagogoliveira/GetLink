services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SuaSenha@123"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql


  authservice:
    build:
      context: ./AuthService

    container_name: authservice

    ports:
      - "7001:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

    depends_on:
      - sqlserver


  urlshortener:
    build:
      context: ./urlShortener

    container_name: urlshortener

    ports:
      - "7000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

    depends_on:
      - sqlserver
      - authservice


volumes:
  sql_data: